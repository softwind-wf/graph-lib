# JitPack 构建配置
#
# 打 tag 后 JitPack 会 clone 该 tag 并执行下面的命令,别人就能这样用:
#   <dependency>
#     <groupId>com.github.softwind-wf</groupId>
#     <artifactId>graph-lib</artifactId>
#     <version>v1.0.0</version>
#   </dependency>
#
# 默认构建(不带 -Pdifferential)不依赖任何第三方:494 个用例直接跑,
# 需要 algs4 参照物的 175 个差分用例由 testExcludes 排除(见 pom.xml 与 README)。
jdk:
  - openjdk8

install:
  - mvn -B install
